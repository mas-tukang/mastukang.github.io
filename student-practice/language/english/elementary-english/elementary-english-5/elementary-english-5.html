<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>English Practice for 1st Grade Elementary School</title>

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS (gunakan CSS yang sama dengan kuis perkalian) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="back-btn">
    <button onclick="location.href='../elementary-english-home.html'">
      ⬅️ Back to Elementary English
    </button>
  </div>

  <h1>English Practice for 5th Grade Elementary School</h1>

  <!-- INFO TIMER -->
  <div id="info">
    ⏱️ Remaining Time: <span id="timer">60:00</span>
  </div>

  <!-- AREA KUIS -->
  <div id="quiz-area" style="display:none;">

    <!-- PROGRESS BAR -->
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>

    <!-- SOAL -->
    <div class="question" id="question"></div>

    <!-- PILIHAN JAWABAN (DIISI OLEH JS) -->
    <div id="choices"></div>

    <!-- PESAN BENAR / SALAH -->
    <div id="message"></div>

    <!-- TOMBOL NEXT (MUNCUL JIKA SALAH) -->
    <button id="nextBtn" class="choice-btn" onclick="soalBerikutnya()" style="display:none;">
      Next
    </button>

  </div>

  <!-- TOMBOL MULAI -->
  <button id="startBtn" class="choice-btn" onclick="mulaiUjian()">
    Start
  </button>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>

</html>
